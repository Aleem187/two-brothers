    <path d="M40 2 L74 12 V44 C74 62 58 74 40 80 C22 74 6 62 6 44 V12 Z"
          fill="none" stroke="#16110E" stroke-width="1" opacity="0.25"/>
    <!-- rooster -->
    <g fill="url(#tbGold)">
      <path d="M46 20c4-4 10-3 11 2 3-1 6 1 6 4 0 3-3 5-6 4 1 3-1 6-4 6-1 4-5 6-9 5l-2 8h-4l1-7c-6-1-11-6-11-13 0-3 1-6 3-8-3-1-5-3-5-6 3 1 6 0 8-2 3-2 8-2 11 1z"/>
    </g>
    <circle cx="49" cy="26" r="2" fill="#16110E"/>
    <path d="M28 52c8 5 20 5 28 0" fill="none" stroke="#16110E" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(96,0)" font-family="'Anton','Oswald','Arial Narrow',sans-serif">
    <text x="0" y="40" font-size="27" fill="#FBF3E7" letter-spacing="0.5">TWO BROTHERS</text>
    <text x="0" y="71" font-size="27" fill="url(#tbGold)" letter-spacing="9.5">CHICKEN</text>
  </g>
</svg>
