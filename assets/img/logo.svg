<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 140" role="img" aria-label="Two Brothers Chicken and Subs">
  <defs>
    <linearGradient id="tbLime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCEE4B"/>
      <stop offset="1" stop-color="#EAD500"/>
    </linearGradient>
  </defs>

  <!-- Emblem: rotated red badge with interlocking lime loops -->
  <g transform="translate(70,70) rotate(-8)">
    <rect x="-58" y="-58" width="116" height="116" rx="28" fill="#E11B22" stroke="#2A0B0C" stroke-width="4"/>
    <rect x="-58" y="-58" width="116" height="116" rx="28" fill="none" stroke="#F7C5C8" stroke-width="1" opacity="0.35"/>
    <!-- two interlocking rounded links (the two brothers) -->
    <g fill="none" stroke="#2A0B0C" stroke-width="20" stroke-linejoin="round">
      <rect x="-40" y="-34" width="46" height="46" rx="16"/>
      <rect x="-6" y="-12" width="46" height="46" rx="16"/>
    </g>
    <g fill="none" stroke="url(#tbLime)" stroke-width="12" stroke-linejoin="round">
      <rect x="-40" y="-34" width="46" height="46" rx="16"/>
      <rect x="-6" y="-12" width="46" height="46" rx="16"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Arial Black','Archivo Black',Impact,sans-serif" font-weight="900">
    <text x="150" y="58" font-size="46" fill="#EE2027" stroke="#2A0B0C" stroke-width="1.4" letter-spacing="-1">Two Brothers</text>
    <rect x="151" y="72" width="288" height="7" rx="3.5" fill="url(#tbLime)"/>
    <text x="151" y="116" font-size="33" fill="url(#tbLime)" stroke="#C0151C" stroke-width="1.1" letter-spacing="0.5">Chicken &amp; Subs</text>
  </g>
</svg>
