<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 96" role="img" aria-label="Two Brothers Chicken">
  <defs>
    <linearGradient id="tbGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD873"/>
      <stop offset="1" stop-color="#E8A33D"/>
    </linearGradient>
  </defs>
  <!-- Emblem: rooster crest inside a shield -->
  <g transform="translate(8,8)">
    <path d="M40 2 L74 12 V44 C74 62 58 74 40 80 C22 74 6 62 6 44 V12 Z"
